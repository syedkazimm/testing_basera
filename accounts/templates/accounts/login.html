{% extends "base.html" %}
{# US-02: log in page. #}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-5">
    <h1 class="h3 mb-3">Log in</h1>
    <form method="post" novalidate>
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      {% include "_form_fields.html" %}
      <button type="submit" class="btn btn-basera">Log in</button>
    </form>
    <p class="mt-3 mb-1">New to Basera? <a href="{% url 'signup' %}">Create an account</a></p>
  </div>
</div>
{% endblock %}
