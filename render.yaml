# Render blueprint: one web service plus a free PostgreSQL database.
services:
  - type: web
    name: basera
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn basera.wsgi"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DEMO_PASSWORD
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: basera-db
          property: connectionString

databases:
  - name: basera-db
    plan: free
